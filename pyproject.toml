[project]
name = "appresearch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["composio>=0.34", "pydantic>=2", "httpx", "rapidfuzz", "trafilatura", "python-dotenv"]
[project.optional-dependencies]
browser = ["playwright"]
api = ["anthropic"]
dev = ["pytest"]
[project.scripts]
appresearch = "appresearch.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
appresearch = ["prompts/*.md", "site/*.html"]
[tool.pytest.ini_options]
pythonpath = ["src"]
